{% extends 'base.html'%}
{% load static %}
{% block content %}
<div class="auth-container">
  <div class="auth-card animate-in">
    <div class="auth-icon">
      <i class="fa-solid fa-right-to-bracket"></i>
    </div>
    <h2 class="auth-title">Welcome <span>Back</span></h2>
    <p class="auth-subtitle">Sign in to your 10MinZepto account</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-floating mb-3">
        <input type="email" placeholder="name@example.com" required name="email" class="form-control" id="floatingEmail"/>
        <label for="floatingEmail"><i class="fa-solid fa-envelope"></i>&nbsp; Email Address</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" placeholder="Password" required name="passwd" class="form-control" id="floatingPassword"/>
        <label for="floatingPassword"><i class="fa-solid fa-lock"></i>&nbsp; Password</label>
      </div>
      <input type="submit" class="btn-primary-custom w-100 py-3 mt-2" value="Sign In"/>
    </form>
    <div class="auth-link">
      Don't have an account? <a href="/user/signup/">Sign Up</a>
    </div>
  </div>
</div>
{% endblock %}
